name: Format social polish temp

on:
  push:
    branches:
      - feat/social-map-empty-marker-polish

permissions:
  contents: write

jobs:
  format-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/social-map-empty-marker-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format files and remove temporary workflow
        run: |
          npx prettier --write src/app/social-polish.css src/components/unified-social-map.tsx
          rm .github/workflows/format-social-polish-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/social-polish.css src/components/unified-social-map.tsx .github/workflows/format-social-polish-temp.yml
          git commit -m "style: format social map polish"
          git push origin HEAD:feat/social-map-empty-marker-polish
