name: Sync shipped Communities docs

on:
  push:
    branches:
      - docs/communities-shipped

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/communities-shipped
      - name: Update canonical product docs
        run: python scripts/sync-community-docs.py
      - name: Commit docs
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md prd-v1.md
          git commit -m "docs: mark Local Posts and Communities as shipped"
          git push origin HEAD:docs/communities-shipped
