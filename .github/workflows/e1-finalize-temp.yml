name: E1 Finalize Temp

on:
  push:
    branches:
      - feat/unified-social-map-measurement

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-social-map-measurement
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/e1-finalize.mjs
      - run: npx prettier --write README.md prd-v1.md ARCHITECTURE.md AGENTS.md competitive-brief.md src/app/api/places/[id]/route.ts src/app/api/signals/route.ts src/app/api/posts/route.ts src/app/api/communities/route.ts src/app/api/map/route.ts
      - name: Commit finalization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: finalize Phase E1 source of truth"
          git push origin HEAD:feat/unified-social-map-measurement
