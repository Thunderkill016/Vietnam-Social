name: E1 Format Temp

on:
  push:
    branches:
      - feat/unified-social-map-measurement

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-social-map-measurement
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/api/bootstrap/route.ts src/app/api/map/route.ts src/components/unified-social-explore.tsx src/components/unified-social-map.tsx src/lib/analytics.ts tests/e1.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app/api/bootstrap/route.ts src/app/api/map/route.ts src/components/unified-social-explore.tsx src/components/unified-social-map.tsx src/lib/analytics.ts tests/e1.test.ts
          git commit -m "style: format E1 implementation"
          git push origin HEAD:feat/unified-social-map-measurement
