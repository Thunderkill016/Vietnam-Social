name: V1 experience finalize temp
on:
  push:
    branches:
      - feat/vietnam-social-v1-experience-reset
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vietnam-social-v1-experience-reset
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Refine product copy and identity
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/unified-social-explore.tsx')
          s = p.read_text()
          replacements = [
            (
              '  CATEGORIES,\n  HCMC_CITY,\n  timeLabel,',
              '  CATEGORIES,\n  CONFIDENCE_LABELS,\n  HCMC_CITY,\n  timeLabel,'
            ),
            (
              '''              <div className={styles.identityRow}>\n                <span\n                  className={styles.entityAvatar}\n                  data-kind="community"\n                  aria-hidden="true"\n                >\n                  <Users size={18} />\n                </span>\n                <span className={styles.identityText}>\n                  <strong>{community.name}</strong>\n                  <span>\n                    {COMMUNITY_CATEGORIES[community.category]} · {community.area}\n                  </span>\n                </span>\n              </div>''',
              '''              <div className={styles.identityRow}>\n                <span className={styles.avatar} aria-hidden="true">\n                  {initials(community.creator.display_name)}\n                </span>\n                <span className={styles.identityText}>\n                  <strong>{community.creator.display_name}</strong>\n                  <span>\n                    đang xây cộng đồng · {community.area}\n                  </span>\n                </span>\n              </div>\n              <span className={styles.kindBadge}>\n                <Users size={12} /> {COMMUNITY_CATEGORIES[community.category]}\n              </span>'''
            ),
            (
              '''                <span className={styles.metaItem}>\n                  bởi {community.creator.display_name}\n                </span>''',
              '''                <span className={styles.metaItem}>\n                  <MapPin size={13} /> {community.place_name || community.area}\n                </span>'''
            ),
            (
              '<span className={styles.metaItem}>{activity.confidence}</span>',
              '<span className={styles.metaItem}>{CONFIDENCE_LABELS[activity.confidence]}</span>'
            ),
            (
              '''          <Link href="/following" className={styles.secondaryAction}>\n            Đang theo dõi\n          </Link>''',
              '''          <Link href="/activities/manage" className={styles.navLink}>\n            <Activity size={15} /> Tổ chức hoạt động\n          </Link>\n          <Link href="/following" className={styles.secondaryAction}>\n            Đang theo dõi\n          </Link>'''
            ),
          ]
          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected block not found:\n{old[:180]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Format changed files
        run: |
          npx prettier --write \
            research/social-product-ux-benchmark-2026.md \
            src/components/unified-social-explore.tsx \
            src/components/unified-social-map.tsx \
            src/components/vietnam-social-v1.module.css \
            src/app/activities/page.tsx \
            src/app/activities/manage/page.tsx \
            tests/e2e/social.spec.ts \
            tests/e2e/demo.spec.ts \
            tests/e2e/live.spec.ts
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/v1-experience-finalize-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize Vietnam Social V1 experience"
          git push origin HEAD:feat/vietnam-social-v1-experience-reset
