name: V1 lint fix temp
on:
  push:
    branches:
      - feat/vietnam-social-v1-experience-reset
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vietnam-social-v1-experience-reset
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: python scripts/v1-lint-fix-temp.py
      - run: npx prettier --write src/components/unified-social-explore.tsx
      - run: |
          rm .github/workflows/v1-lint-fix-temp.yml scripts/v1-lint-fix-temp.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): derive map layer without effect state"
          git push origin HEAD:feat/vietnam-social-v1-experience-reset
