name: V1 lint fix temp
on:
  push:
    branches:
      - feat/vietnam-social-v1-experience-reset
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/vietnam-social-v1-experience-reset
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve URL filter without setState effect
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/unified-social-explore.tsx')
          s = p.read_text()
          old_state = '  const [filter, setFilter] = useState<SocialMapFilter>(initialFilter);'
          new_state = '''  const [filter, setFilter] = useState<SocialMapFilter>(() => {
    if (typeof window === "undefined") return initialFilter;
    const requestedLayer = new URLSearchParams(window.location.search).get(
      "layer",
    ) as SocialMapFilter | null;
    return requestedLayer && SOCIAL_MAP_FILTERS.includes(requestedLayer)
      ? requestedLayer
      : initialFilter;
  });'''
          old_effect = '''  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const requestedLayer = params.get("layer") as SocialMapFilter | null;
    if (
      requestedLayer &&
      SOCIAL_MAP_FILTERS.includes(requestedLayer as SocialMapFilter)
    ) {
      setFilter(requestedLayer);
    }

    const id = params.get("post");'''
          new_effect = '''  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    const id = params.get("post");'''
          for old, new in [(old_state, new_state), (old_effect, new_effect)]:
            if old not in s:
              raise SystemExit(f'Expected block not found: {old[:160]}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          npx prettier --write src/components/unified-social-explore.tsx
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/v1-lint-fix-temp.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(ui): derive map layer without effect state"
          git push origin HEAD:feat/vietnam-social-v1-experience-reset
