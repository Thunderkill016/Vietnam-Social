name: E1 Typecheck Fix Temp

on:
  push:
    branches:
      - feat/unified-social-map-measurement

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unified-social-map-measurement
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/e1-typecheck-fix.mjs
      - run: npx prettier --write src/components/unified-social-explore.tsx
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/unified-social-explore.tsx
          git commit -m "fix(e1): correct Local Post deep-link type label"
          git push origin HEAD:feat/unified-social-map-measurement
